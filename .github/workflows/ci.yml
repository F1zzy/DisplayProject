name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/client/package-lock.json
            backend/remote-analytics/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install client dependencies
        working-directory: backend/client
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Lint client
        working-directory: backend/client
        run: npm run lint

      - name: Run backend tests
        working-directory: backend
        run: npm test
        env:
          CONTROL_API_KEY: test-control-key
          WEATHER_API_KEY: test
          NEWS_API_KEY: test
          STOCK_API_KEY: test

      - name: Run client tests
        working-directory: backend/client
        run: npm test -- --watchAll=false

      - name: Build client
        working-directory: backend/client
        run: npm run build

      - name: Install remote-analytics dependencies
        working-directory: backend/remote-analytics
        run: npm ci

      - name: Build remote-analytics
        working-directory: backend/remote-analytics
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: backend
        run: npm run test:e2e
        env:
          CI: true
          CONTROL_API_KEY: test-control-key
          WEATHER_API_KEY: test
          NEWS_API_KEY: test
          STOCK_API_KEY: test
