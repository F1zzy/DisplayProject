<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="/remote/manifest.json" />
  <title>Display Remote</title>
  <link rel="stylesheet" href="/remote/styles.css" />
</head>
<body>
  <main class="remote">
    <h1>Display Remote</h1>
    <p class="remote-status" id="status">Enter API key to unlock</p>

    <section class="remote-section" id="lockSection">
      <h2>Unlock</h2>
      <label>
        Server URL
        <input id="serverUrl" type="text" placeholder="http://localhost:3000" />
      </label>
      <label>
        API Key
        <input id="apiKey" type="password" placeholder="CONTROL_API_KEY" autocomplete="current-password" />
      </label>
      <div class="remote-buttons">
        <button type="button" id="unlockBtn">Unlock</button>
      </div>
    </section>

    <div id="controls" class="remote-controls" hidden>
      <div class="remote-toolbar">
        <button type="button" id="lockBtn" class="remote-lock-btn">Lock</button>
      </div>

      <section class="remote-section">
        <h2>Display Power</h2>
        <div class="remote-buttons">
          <button type="button" data-action="on">On</button>
          <button type="button" data-action="sleep">Sleep</button>
          <button type="button" data-action="off">Off</button>
        </div>
      </section>

      <section class="remote-section">
        <h2>Widgets</h2>
        <div class="remote-buttons" id="widgetButtons">
          <button type="button" data-widget="rotate">Next Widget</button>
        </div>
      </section>

      <section class="remote-section">
        <h2>Dashboard Settings</h2>
        <label>
          Location
          <input id="settingLocation" type="text" placeholder="Nottingham" />
        </label>
        <label>
          Stock symbols (comma-separated)
          <input id="settingSymbols" type="text" placeholder="AAPL,GOOGL,MSFT" />
        </label>
        <label>
          Widget rotation (seconds, 0 = pause)
          <input id="settingRotation" type="number" min="0" max="3600" step="1" />
        </label>
        <label>
          Calendar days ahead
          <input id="settingCalendarDays" type="number" min="1" max="7" step="1" />
        </label>
        <label>
          Forecast days
          <input id="settingForecastDays" type="number" min="1" max="7" step="1" />
        </label>
        <fieldset class="remote-fieldset">
          <legend>Enabled widgets</legend>
          <label class="remote-check">
            <input type="checkbox" name="enabledWidget" value="stock" /> Stocks
          </label>
          <label class="remote-check">
            <input type="checkbox" name="enabledWidget" value="news" /> News
          </label>
          <label class="remote-check">
            <input type="checkbox" name="enabledWidget" value="timetable" /> Schedule
          </label>
          <label class="remote-check">
            <input type="checkbox" name="enabledWidget" value="network" /> Network
          </label>
        </fieldset>
        <fieldset class="remote-fieldset">
          <legend>News columns</legend>
          <label class="remote-check">
            <input type="checkbox" id="settingNewsGeneral" /> General / BBC
          </label>
          <label class="remote-check">
            <input type="checkbox" id="settingNewsTechnology" /> Technology
          </label>
        </fieldset>
        <fieldset class="remote-fieldset">
          <legend>Background</legend>
          <label>
            Mode
            <select id="settingBackgroundMode">
              <option value="default">Default gradient</option>
              <option value="color">Solid colour</option>
              <option value="image">Image URL</option>
            </select>
          </label>
          <label id="settingBackgroundColorRow">
            Colour
            <input id="settingBackgroundColor" type="color" value="#141212" />
          </label>
          <label id="settingBackgroundImageRow">
            Image URL
            <input id="settingBackgroundImage" type="url" placeholder="https://example.com/photo.jpg" />
          </label>
        </fieldset>
        <div class="remote-buttons">
          <button type="button" id="saveSettingsBtn">Save settings</button>
        </div>
      </section>
    </div>
  </main>
  <script src="/remote/app.js"></script>
</body>
</html>
