<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101115" />
  <link rel="manifest" href="/remote/manifest.json" />
  <title>Display Remote</title>
  <link rel="stylesheet" href="/remote/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">DISPLAY</span>
      </div>
      <div class="topbar-meta">
        <span class="status-pill" id="statusPill">LOCKED</span>
        <button type="button" id="lockBtn" class="icon-box" hidden title="Lock session">⟲</button>
      </div>
    </header>

    <p class="remote-status" id="status" role="status">Enter API key to unlock</p>

    <section class="panel panel--lock" id="lockSection">
      <div class="panel-header">
        <h2 class="panel-title">Access</h2>
        <span class="panel-badge">SECURE</span>
      </div>
      <div class="field-grid">
        <label class="field">
          <span class="field-label">Server URL</span>
          <input id="serverUrl" type="text" placeholder="http://localhost:3000" />
        </label>
        <label class="field">
          <span class="field-label">API Key</span>
          <input id="apiKey" type="password" placeholder="CONTROL_API_KEY" autocomplete="current-password" />
        </label>
      </div>
      <button type="button" id="unlockBtn" class="btn-primary">
        <span>Unlock Remote</span>
        <span class="btn-bolt" aria-hidden="true">→</span>
      </button>
    </section>

    <div id="controls" class="remote-controls" hidden>
      <nav class="remote-nav" aria-label="Remote sections">
        <span class="remote-nav-indicator" aria-hidden="true"></span>
        <button type="button" class="remote-nav-btn is-active" data-remote-view="control">Control</button>
        <button type="button" class="remote-nav-btn" data-remote-view="settings">Settings</button>
      </nav>

      <div class="remote-view is-active" data-view-panel="control">
        <section class="panel panel--compact anim-in" style="--delay: 0ms">
          <div class="panel-header panel-header--compact">
            <h2 class="panel-title">Power</h2>
            <span class="panel-badge" id="powerStateBadge">READY</span>
          </div>
          <div class="power-grid">
            <button type="button" class="power-btn power-btn--on" data-action="on">
              <span class="power-ring">⏻</span>
              <span class="power-caption">On</span>
            </button>
            <button type="button" class="power-btn power-btn--sleep" data-action="sleep">
              <span class="power-ring">☾</span>
              <span class="power-caption">Sleep</span>
            </button>
            <button type="button" class="power-btn power-btn--off" data-action="off">
              <span class="power-ring">○</span>
              <span class="power-caption">Off</span>
            </button>
          </div>
        </section>

        <section class="panel panel--compact anim-in" style="--delay: 60ms">
          <div class="panel-header panel-header--compact">
            <h2 class="panel-title">Widgets</h2>
            <span class="panel-badge">JUMP / PIN</span>
          </div>
          <div class="chip-row" id="widgetButtons">
            <button type="button" data-widget="rotate" class="chip">Next Widget</button>
          </div>
        </section>
      </div>

      <div class="remote-view" data-view-panel="settings" hidden>
        <div class="settings-stack anim-in" style="--delay: 0ms">
          <details class="settings-group" open>
            <summary class="settings-group-summary">General</summary>
            <div class="settings-group-body">
              <div class="settings-grid">
                <label class="field">
                  <span class="field-label">Location</span>
                  <input id="settingLocation" type="text" placeholder="Nottingham" />
                </label>
                <label class="field">
                  <span class="field-label">Stock symbols</span>
                  <input id="settingSymbols" type="text" placeholder="AAPL,GOOGL,MSFT" />
                </label>
                <label class="field">
                  <span class="field-label">Rotation (sec)</span>
                  <input id="settingRotation" type="number" min="0" max="3600" step="1" />
                </label>
                <label class="field">
                  <span class="field-label">Calendar days</span>
                  <input id="settingCalendarDays" type="number" min="1" max="7" step="1" />
                </label>
                <label class="field">
                  <span class="field-label">Forecast days</span>
                  <input id="settingForecastDays" type="number" min="1" max="7" step="1" />
                </label>
              </div>
            </div>
          </details>

          <details class="settings-group">
            <summary class="settings-group-summary">Widgets &amp; news</summary>
            <div class="settings-group-body">
              <div class="subpanel subpanel--flush">
                <div class="subpanel-title">Enabled widgets</div>
                <div class="toggle-list">
                  <label class="toggle-row">
                    <span class="toggle-copy">Stocks <b>Market</b></span>
                    <input type="checkbox" name="enabledWidget" value="stock" class="toggle-input" />
                    <span class="toggle" aria-hidden="true"></span>
                  </label>
                  <label class="toggle-row">
                    <span class="toggle-copy">News <b>Headlines</b></span>
                    <input type="checkbox" name="enabledWidget" value="news" class="toggle-input" />
                    <span class="toggle" aria-hidden="true"></span>
                  </label>
                  <label class="toggle-row">
                    <span class="toggle-copy">Schedule <b>Calendar</b></span>
                    <input type="checkbox" name="enabledWidget" value="timetable" class="toggle-input" />
                    <span class="toggle" aria-hidden="true"></span>
                  </label>
                  <label class="toggle-row">
                    <span class="toggle-copy">Network <b>Stats</b></span>
                    <input type="checkbox" name="enabledWidget" value="network" class="toggle-input" />
                    <span class="toggle" aria-hidden="true"></span>
                  </label>
                  <label class="toggle-row">
                    <span class="toggle-copy">Night Sky <b>Chart</b></span>
                    <input type="checkbox" name="enabledWidget" value="sky" class="toggle-input" />
                    <span class="toggle" aria-hidden="true"></span>
                  </label>
                  <label class="toggle-row">
                    <span class="toggle-copy">Spotify <b>Now Playing</b></span>
                    <input type="checkbox" name="enabledWidget" value="spotify" class="toggle-input" />
                    <span class="toggle" aria-hidden="true"></span>
                  </label>
                  <label class="toggle-row">
                    <span class="toggle-copy">Formula 1 <b>Standings</b></span>
                    <input type="checkbox" name="enabledWidget" value="f1" class="toggle-input" />
                    <span class="toggle" aria-hidden="true"></span>
                  </label>
                </div>
              </div>
              <div class="subpanel">
                <div class="subpanel-title">News columns</div>
                <div class="toggle-list">
                  <label class="toggle-row">
                    <span class="toggle-copy">General <b>BBC</b></span>
                    <input type="checkbox" id="settingNewsGeneral" class="toggle-input" />
                    <span class="toggle" aria-hidden="true"></span>
                  </label>
                  <label class="toggle-row">
                    <span class="toggle-copy">Technology <b>Feed</b></span>
                    <input type="checkbox" id="settingNewsTechnology" class="toggle-input" />
                    <span class="toggle" aria-hidden="true"></span>
                  </label>
                </div>
              </div>
            </div>
          </details>

          <details class="settings-group">
            <summary class="settings-group-summary">Appearance</summary>
            <div class="settings-group-body">
              <div class="settings-grid">
                <label class="field">
                  <span class="field-label">Background</span>
                  <select id="settingBackgroundMode">
                    <option value="default">Default</option>
                    <option value="color">Solid colour</option>
                    <option value="image">Image URL</option>
                  </select>
                </label>
                <label class="field field--reveal" id="settingBackgroundColorRow">
                  <span class="field-label">Colour</span>
                  <input id="settingBackgroundColor" type="color" value="#101115" />
                </label>
                <label class="field field--reveal" id="settingBackgroundImageRow">
                  <span class="field-label">Image URL</span>
                  <input id="settingBackgroundImage" type="url" placeholder="https://example.com/photo.jpg" />
                </label>
                <label class="field">
                  <span class="field-label">Colour scheme</span>
                  <select id="settingColorScheme">
                    <option value="orange-dark">Orange dark</option>
                    <option value="cool-blue">Cool blue</option>
                    <option value="soft-neutral">Soft neutral</option>
                    <option value="forest">Forest</option>
                  </select>
                </label>
                <label class="field">
                  <span class="field-label">Font</span>
                  <select id="settingFontPreset">
                    <option value="nothing">Nothing</option>
                    <option value="time-caps">Time Caps</option>
                    <option value="system">System</option>
                  </select>
                </label>
                <label class="field">
                  <span class="field-label">Clock animation</span>
                  <select id="settingClockAnimation">
                    <option value="off">Off</option>
                    <option value="crossfade">Crossfade</option>
                    <option value="flip">Flip</option>
                  </select>
                </label>
              </div>
              <div class="toggle-list">
                <label class="toggle-row">
                  <span class="toggle-copy">Weather <b>Atmosphere</b></span>
                  <input type="checkbox" id="settingWeatherAtmosphere" class="toggle-input" />
                  <span class="toggle" aria-hidden="true"></span>
                </label>
                <label class="toggle-row">
                  <span class="toggle-copy">Night <b>Focus mode</b></span>
                  <input type="checkbox" id="settingNightFocusMode" class="toggle-input" />
                  <span class="toggle" aria-hidden="true"></span>
                </label>
              </div>
              <label class="field" id="settingNightFocusWhenRow">
                <span class="field-label">Focus when</span>
                <select id="settingNightFocusWhen">
                  <option value="auto">Auto (sunset–sunrise)</option>
                  <option value="always">Always on</option>
                  <option value="custom">Custom hours</option>
                </select>
              </label>
              <div class="settings-grid">
                <label class="field field--reveal" id="settingNightFocusStartRow">
                  <span class="field-label">Focus start hour</span>
                  <input id="settingNightFocusStartHour" type="number" min="0" max="23" step="1" />
                </label>
                <label class="field field--reveal" id="settingNightFocusEndRow">
                  <span class="field-label">Focus end hour</span>
                  <input id="settingNightFocusEndHour" type="number" min="0" max="23" step="1" />
                </label>
              </div>
              <label class="field">
                <span class="field-label">Brightness (<span id="settingBrightnessValue">100</span>%)</span>
                <input id="settingDisplayBrightness" type="range" min="10" max="100" step="5" />
              </label>
            </div>
          </details>

          <details class="settings-group">
            <summary class="settings-group-summary">Layout</summary>
            <div class="settings-group-body">
              <div class="field">
                <span class="field-label">Section order</span>
                <div id="sectionOrderList" class="section-order-list" role="list"></div>
              </div>
              <div class="settings-grid">
                <label class="field">
                  <span class="field-label">Clock side</span>
                  <select id="settingClockSide">
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                  </select>
                  <span class="field-hint">Landscape only</span>
                </label>
                <label class="field">
                  <span class="field-label">Density</span>
                  <select id="settingDensity">
                    <option value="compact">Compact</option>
                    <option value="comfortable">Comfortable</option>
                    <option value="roomy">Roomy</option>
                  </select>
                </label>
              </div>
            </div>
          </details>
        </div>

        <div class="settings-footer">
          <button type="button" id="saveSettingsBtn" class="btn-primary btn-primary--save">
            <span id="saveBtnLabel">Save settings</span>
            <span class="btn-bolt" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="/remote/app.js"></script>
</body>
</html>
